name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  # Python output is captured by PowerShell on English Windows runners.
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .\.venv\Scripts\python.exe tools/check_version.py $env:RELEASE_TAG
      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe tools/run_tests.py
      - name: Install compiler
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build installer
        shell: pwsh
        env:
          # Встроенный вход Google/Microsoft (Settings → Secrets and variables → Actions). Пусто — без него.
          SIMPLEMAIL_GOOGLE_CLIENT_ID: ${{ secrets.SIMPLEMAIL_GOOGLE_CLIENT_ID }}
          SIMPLEMAIL_GOOGLE_CLIENT_SECRET: ${{ secrets.SIMPLEMAIL_GOOGLE_CLIENT_SECRET }}
          SIMPLEMAIL_MICROSOFT_CLIENT_ID: ${{ secrets.SIMPLEMAIL_MICROSOFT_CLIENT_ID }}
        run: ./tools/build_installer.ps1
      - name: Test installed application and update handoff
        shell: pwsh
        run: ./tools/test_installer.ps1 -IsccPath "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: SimpleMail-Windows-installer
          path: dist/installer/*
          if-no-files-found: error
          # Ручной прогон (проверка ветки): установщик ~150 МБ хранится 1 день, чтобы не забивать квоту.
          # Тег: 0 — срок хранения по умолчанию из настроек репозитория.
          retention-days: ${{ !startsWith(github.ref, 'refs/tags/') && 1 || 0 }}

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SimpleMail-Windows-installer
          path: installer
      - name: Create draft release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; keeping its verified assets."
          else
            gh release create "$RELEASE_TAG" installer/* --verify-tag --draft --title "SimpleMail $RELEASE_TAG" --generate-notes
          fi
